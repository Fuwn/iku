version: "3"

vars:
  BINARY: iku

tasks:
  default:
    desc: Build the application
    cmds:
      - task: build

  build:
    desc: Build the binary with optimisations
    cmds:
      - go build -ldflags="-s -w" -o {{.BINARY}} .
    sources:
      - ./**/*.go
    generates:
      - ./{{.BINARY}}

  install:
    desc: Install the binary to GOPATH/bin
    cmds:
      - go install -ldflags="-s -w" .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - go clean

  test:
    desc: Run tests
    cmds:
      - go test ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem ./...

  fmt:
    desc: Format code with the current checkout
    cmds:
      - go run . -w .

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run
